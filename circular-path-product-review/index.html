<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Circular Path Product Review</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201b;
      --muted: #5f6d65;
      --line: #d8ded8;
      --panel: #ffffff;
      --page: #f6f7f4;
      --green: #2f6f4e;
      --red: #9f352b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(23, 32, 27, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0 0 16px; color: var(--muted); }
    label { display: block; margin: 18px 0 6px; font-weight: 700; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 11px 12px;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      padding: 11px 12px;
      background: var(--green);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .error { color: var(--red); min-height: 22px; margin-top: 12px; }
    .note { font-size: 13px; }
  </style>
</head>

    function decodeBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }
    async function deriveKey(passphrase, salt, iterations) {
      const encoded = new TextEncoder().encode(passphrase);
      const material = await crypto.subtle.importKey('raw', encoded, 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }
    async function unlock(passphrase) {
      const salt = decodeBase64(encryptedPage.salt);
      const nonce = decodeBase64(encryptedPage.nonce);
      const ciphertext = decodeBase64(encryptedPage.ciphertext);
      const key = await deriveKey(passphrase, salt, encryptedPage.iterations);
      const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ciphertext);
      const html = new TextDecoder().decode(plaintext);
      document.open();
      document.write(html);
      document.close();
    }
    document.getElementById('unlockForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('unlockButton');
      const message = document.getElementById('message');
      button.disabled = true;
      button.textContent = 'Opening...';
      message.textContent = '';
      try {
        await unlock(document.getElementById('passphrase').value);
      } catch (error) {
        message.textContent = 'That passphrase did not open the review.';
        button.disabled = false;
        button.textContent = 'Open Review';
      }
    });
